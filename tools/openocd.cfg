# OpenOCD config - STM32F411CEU6 / WeAct BlackPill V3.0 with an ST-Link V2 clone.
#
#   openocd -f tools/openocd.cfg
#
# Requires the NRST wire between ST-Link RST and the board RST pin.

# stlink-dap.cfg = native DAP driver. The older stlink.cfg uses the hla driver,
# which cannot hold the target in reset while attaching.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

source [find target/stm32f4x.cfg]

# Must be after the target config: stm32f4x.cfg sets 2000 kHz itself.
adapter speed 100

# connect_assert_srst holds the chip in reset while attaching, so an attach
# works even if the firmware has hung. srst_open_drain matches the STM32's
# open-drain NRST.
reset_config srst_only srst_nogate srst_open_drain connect_assert_srst

gdb_port    3333
telnet_port 4444
